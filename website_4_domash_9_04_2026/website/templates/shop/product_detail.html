{% extends "base.html" %}

{% block main %}
{% load thumbnail %}

<div class="container" style="padding-top: 20px; padding-bottom: 40px;">
    <div class="row">
        <div class="col-md-6 text-center">
            <div class="thumbnail" style="padding: 15px;">
                <img src="{{ product.image.url }}"
                     class="img-responsive center-block"
                     alt="{{ product.title }}"
                     style="max-height: 400px; width: auto; max-width: 100%; object-fit: contain;">
            </div>
        </div>

        <div class="col-md-6">
            <h2 style="margin-top: 0;">{{ product.title }}</h2>
            <p class="text-primary" style="font-size: 24px; font-weight: bold;">
                {{ product.price }} грн
            </p>
            <p class="text-muted">{{ product.description }}</p>
            <hr>
            <p>
                <a class="btn btn-primary btn-lg" href="{% url 'cart:cart_add' product_id=product.id %}">У кошик</a>
                <a href="{% url 'shop:product_list' %}" class="btn btn-default btn-lg">← До каталогу</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
