<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Blog Home - Start Bootstrap Template</title>

    <!-- Bootstrap 3 (як у шаблоні Start Bootstrap blog-home) -->
    <link href="{% static 'blog/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'blog/css/blog-home.css' %}" rel="stylesheet">

    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
    <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>

<body style="background-color: #ffe8cc;">

{% include 'components/navbar.html' %}

{% if messages %}
<div class="container" style="margin-top: 10px;">
    {% for message in messages %}
    <div class="alert alert-{% if 'success' in message.tags %}success{% elif 'error' in message.tags %}danger{% else %}info{% endif %} alert-dismissible">
        <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}

{% block main %} {% endblock %}

    <footer class="container">
        <div class="row">
            <div class="col-lg-12">
                <p>Copyright &copy; Your Website 2026</p>
            </div>
        </div>
    </footer>

<script src="{% static 'blog/js/jquery.js' %}"></script>
<script src="{% static 'blog/js/bootstrap.min.js' %}"></script>

</body>

</html>
