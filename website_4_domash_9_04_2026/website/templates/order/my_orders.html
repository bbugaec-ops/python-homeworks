{% extends "base.html" %}

{% block main %}
<div class="container mt-5">
    <h2 class="mb-4">Мої замовлення</h2>
    {% if orders %}
    <ul class="list-group">
        {% for o in orders %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <a href="{% url 'order:order_detail' o.pk %}"><strong>{{ o.order_number }}</strong></a>
                <span class="text-muted ms-2">{{ o.get_status_display }}</span>
                <br>
                <small class="text-muted">{{ o.created_at|date:"d.m.Y H:i" }}</small>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>У вас ще немає замовлень.</p>
    <a class="btn btn-primary" href="{% url 'shop:product_list' %}">У магазин</a>
    {% endif %}
</div>
{% endblock %}
