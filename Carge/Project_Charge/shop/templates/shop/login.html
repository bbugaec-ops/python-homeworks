<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід — Charge</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 1rem; color: #333; }
        h1 { font-size: 1.35rem; }
        form p { margin: 0.75rem 0; }
        label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.25rem; }
        input[type="text"], input[type="password"] { width: 100%; max-width: 100%; padding: 0.5rem 0.6rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        form ul.errorlist { font-size: 0.8rem; color: #b71c1c; margin: 0.35rem 0 0; padding-left: 1rem; }
        button[type="submit"] {
            margin-top: 1rem; padding: 0.65rem 1.25rem; border: none; border-radius: 10px;
            background: #0d47a1; color: #fff; font-weight: 700; cursor: pointer;
        }
        button[type="submit"]:hover { filter: brightness(1.08); }
        a { color: #0d47a1; }
    </style>
</head>
<body>
    {% include "shop/includes/_nav.html" %}
    <p><a href="{% url 'home' %}">← На головну</a></p>
    <h1>Вхід</h1>
    {% if request.GET.next %}
    <p style="font-size:0.9rem;color:#666;">Увійдіть, щоб продовжити.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next|default:'' }}">
        <button type="submit">Увійти</button>
    </form>
    <p style="margin-top:1.25rem;font-size:0.9rem;">Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a> — знижка {{ registered_discount_percent }}% для авторизованих покупців.</p>
</body>
</html>
